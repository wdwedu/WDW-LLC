name: WDW homepage navigation patch
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wdw-home-nav-patch.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Articles and AI Command Center to homepage navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          if 'href="/articles/"' in s and 'href="/ai-command-center/"' in s:
              print("Navigation already connected.")
          else:
              old='<a class="nav-link nav-item-clean" href="#workflows"><span class="nav-icon">⌬</span><span class="label">Workflows</span></a><a class="nav-link nav-item-clean" href="#contact"><span class="nav-icon">✉</span><span class="label">Contact</span></a>'
              new='<a class="nav-link nav-item-clean" href="#workflows"><span class="nav-icon">⌬</span><span class="label">Workflows</span></a><a class="nav-link nav-item-clean" href="/articles/"><span class="nav-icon">▤</span><span class="label">Articles</span></a><a class="nav-link nav-item-clean" href="/ai-command-center/"><span class="nav-icon">▦</span><span class="label">AI Command Center</span></a><a class="nav-link nav-item-clean" href="#contact"><span class="nav-icon">✉</span><span class="label">Contact</span></a>'
              if s.count(old)!=1:
                  raise SystemExit(f"Expected one navigation insertion point, found {s.count(old)}")
              p.write_text(s.replace(old,new),encoding="utf-8")
              print("Homepage navigation connected.")
          PY
      - name: Remove one-time workflow and commit patch
        run: |
          rm -f .github/workflows/wdw-home-nav-patch.yml
          git config user.name "WDW Site Automation"
          git config user.email "wdwedu@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Connect Articles and AI Command Center in homepage navigation"
            git push
          fi
